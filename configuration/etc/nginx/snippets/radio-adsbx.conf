# nginx configuration for tar1090
location /adsbx/data/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
  alias /run/radio-adsb/;
  gzip_static off;
  location ~ aircraft\.json$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_static on;
  }
  location /adsbx/data/traces/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    location ~ trace_recent {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
      gzip off;
    add_header Cache-Control "no-cache";
      add_header Content-Encoding "gzip";
    }
    location ~ trace_full {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
      gzip off;
    add_header Cache-Control "no-cache";
      add_header Content-Encoding "gzip";
    }
  }
  location ~ globe_.*\.json$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip off;
    add_header Cache-Control "no-cache";
    add_header Content-Encoding "gzip";
  }
  location ~ .*\.binCraft$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip off;
    add_header Cache-Control "no-cache";
    add_header Content-Encoding "gzip";
  }
  location ~ .*\.zst$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip off;
    add_header Cache-Control "no-cache";
  }
}

location /adsbx/osm_tiles_offline/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
  alias /usr/local/share/osm_tiles_offline/;
}

location /adsbx/openfreemap_offline/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
  alias /usr/local/share/openfreemap_offline/mnt/;
  location /adsbx/openfreemap_offline/tiles/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
      add_header Content-Encoding "gzip";
  }
}

location /adsbx/globe_history/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
  alias /var/globe_history/;
  gzip on;
  gzip_static off;

  location ~ /acas/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    default_type text/plain;
    add_header Cache-Control "no-cache";

    gzip_static on;
  }

  location ~ ....-..-.. {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    absolute_redirect off;
    rewrite "^(.*)/globe_history/(....)-(..)-(..)/(.*)$" "$1/globe_history/$2/$3/$4/$5" last;
  }

  location ~ traces/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip off;
    add_header Cache-Control "public, max-age=1209600";
    add_header Content-Encoding "gzip";
  }
  location ~ heatmap/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip off;
    add_header Cache-Control "public, max-age=1209600";
    add_header Content-Encoding "gzip";
  }
}

location /adsbx/chunks/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
  alias /run/tar1090-adsbx/;
  gzip_static off;
  location ~ chunk_.*\.gz$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip off;
    add_header Cache-Control "public, max-age=86400";
    add_header Content-Type "application/json";
    add_header Content-Encoding "gzip";
  }
  location ~ current_.*\.gz$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip off;
    add_header Cache-Control "no-cache";
    add_header Content-Type "application/json";
    add_header Content-Encoding "gzip";
  }
  location ~ .*\.json$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip on;
    add_header Cache-Control "no-cache";
  }
}

location /adsbx/aircraft_sil/ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    alias /usr/local/share/tar1090/aircraft_sil/;
    add_header Cache-Control "public, max-age=1209600";
    try_files $uri /aircraft_sil/ZZZZ.png;
    absolute_redirect off;
}

location /adsbx {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
  alias /usr/local/share/tar1090/html-adsbx/;
  try_files $uri $uri/ =404;
  absolute_redirect off;

  # location block priority:
  # = / exact location matches > regex matches > prefix matchs

  # exact matches
  location = /adsbx/config.js {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    add_header Cache-Control "no-cache";
  }
  location = /adsbx/index.html {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    add_header Cache-Control "no-cache";
  }

  # regex matches
  location ~ ^/adsbx/style.*\.css$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    add_header Cache-Control "public, max-age=1209600";
  }

  location ~ ^/adsbx/db-.*\.js$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    gzip off;
    gzip_static off;
    add_header Cache-Control "public, max-age=1209600";
    add_header Content-Encoding "gzip";
  }

  location ~ ^/adsbx/libs/.*$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    add_header Cache-Control "public, max-age=1209600";
  }
  location ~ ^/adsbx/[^/]*\.js$ {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    add_header Cache-Control "public, max-age=1209600";
  }

  # prefix matches
  location /adsbx/images {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    add_header Cache-Control "public, max-age=1209600";
  }
  location /adsbx/flags {
  allow 127.0.0.1;
  allow 192.168.1.0/24;
  deny all;
    add_header Cache-Control "public, max-age=1209600";
  }
}
